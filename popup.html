<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 250px; font-family: sans-serif; padding: 10px; }
    input, label { display: block; width: 100%; margin-bottom: 8px; }
    .row { display: flex; gap: 5px; align-items: center; }
    button { width: 100%; padding: 8px; background: #00a1e1; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h4>🤖 MR600 Bot v1.0</h4>
  
  <label>Scan for text (comma-sep.):</label>
  <input type="text" id="targets" value="80%, 100%">
  
  <label>From sender:</label>
  <input type="text" id="sender" value="KPN">
  
  <hr>
  
  <label>Reply to:</label>
  <input type="text" id="replyNum" value="1266">
  
  <label>Answer with:</label>
  <input type="text" id="replyMsg" value="NL2000 AAN">
  
  <div class="row">
    <input type="checkbox" id="autoClean" checked style="width: auto;">
    <label for="autoClean">Auto-clean Inbox/Outbox</label>
  </div>

  <button id="save">Save & Restart</button>
  <script src="popup.js"></script>
</body>
</html>
